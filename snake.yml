name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Manuelih
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#5b2a86,#7c3aed,#a855f7,#c084fc
            dist/snake-light.svg?palette=github-light&color_snake=#A855F7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
